<script>
    function togglePassword() {
        const pwdInput = document.getElementById('password');
        const icon = document.getElementById('password_icon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.innerText = 'visibility_off';
        } else {
            pwdInput.type = 'password';
            icon.innerText = 'visibility';
        }
    }

    // Atmospheric focus effects for glass theme
    const inputs = document.querySelectorAll('.input-underlined');
    inputs.forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.querySelector('label').classList.replace('text-on-surface-variant', 'text-primary');
        });
        input.addEventListener('blur', () => {
            if (!input.value) {
                input.parentElement.querySelector('label').classList.replace('text-primary', 'text-on-surface-variant');
            }
        });
    });

    // Form submission interaction
 
</script>
